name: Deploy Vue to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 关键修复：--config.minimumReleaseAge=0 放行刚发布的包；--allow-build 放行esbuild等构建脚本
      - name: Install dependencies
        run: pnpm install --config.minimumReleaseAge=0 --allow-build

      - name: Build with Vite
        run: pnpm run build
        env:
          NODE_ENV: production
          BASE_URL: /${{ github.event.repository.name }}/

      # 添加 .nojekyll 文件防止 Jekyll 静态资源解析异常
      - name: Create .nojekyll
        run: echo '' > dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
