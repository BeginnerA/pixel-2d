name: Deploy Vue to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 提前设置pnpm全局配置，允许构建脚本、关闭最小发布时间限制
      - name: Set pnpm config
        run: |
          pnpm config set minimumReleaseAge 0
          pnpm config set scripts.allow-builds true
          pnpm config set scripts.allow-all true

      - name: Install dependencies
        run: pnpm install

      - name: Build with Vite
        run: pnpm run build
        env:
          NODE_ENV: production
          BASE_URL: /${{ github.event.repository.name }}/

      # 添加 .nojekyll 文件防止 Jekyll 处理
      - name: Create .nojekyll
        run: echo '' > dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
